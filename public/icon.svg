<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Deep Space Gradient matching StellaWay theme -->
    <radialGradient id="spaceGradient" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#2D1754" />
      <stop offset="55%" stop-color="#180C30" />
      <stop offset="100%" stop-color="#0A0416" />
    </radialGradient>

    <!-- Warm Golden Glowing Gradients for the Star -->
    <linearGradient id="stellaGoldGrad" x1="20%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#FFF8E0" />
      <stop offset="35%" stop-color="#FCE196" />
      <stop offset="70%" stop-color="#F0DEAA" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>

    <!-- Golden Ring Gradient -->
    <linearGradient id="ringGoldGrad" x1="0%" y1="80%" x2="100%" y2="20%">
      <stop offset="0%" stop-color="#F0DEAA" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#FFF5D6" />
      <stop offset="100%" stop-color="#FCE196" />
    </linearGradient>

    <!-- Filter for soft ambient glow -->
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="24" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle stars in background -->
    <radialGradient id="starHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F0DEAA" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#F0DEAA" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#F0DEAA" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base App Icon Background with smooth squircle border radius -->
  <rect width="512" height="512" rx="112" fill="url(#spaceGradient)"/>

  <!-- Subtle ambient starry background dots -->
  <circle cx="95" cy="110" r="1.5" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="140" cy="390" r="1.8" fill="#FCE196" opacity="0.5"/>
  <circle cx="410" cy="130" r="2.0" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="420" cy="380" r="1.5" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="80" cy="280" r="1.2" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="340" cy="430" r="1.6" fill="#FCE196" opacity="0.6"/>

  <!-- Warm Golden Halo Behind the Star -->
  <circle cx="242" cy="256" r="150" fill="url(#starHalo)"/>

  <!-- Centered Scaled Icon Group (viewBox 0 0 100 90 -> translated & scaled to 512x512) -->
  <!-- scale factor 3.8, translated to center around 256, 256 -->
  <g transform="translate(68, 86) scale(4.0)" filter="url(#goldGlow)">
    
    <!-- 1. Central 5-Point Star Body (Solid Metallic Champagne Gold with clean geometry) -->
    <path
      d="M 44 16
         L 52 34
         L 72 35
         L 56.5 48
         L 62 69
         L 44 57.5
         L 26 69
         L 31.5 48
         L 16 35
         L 36 34 Z"
      fill="url(#stellaGoldGrad)"
      stroke="#FFFDF2"
      stroke-width="0.8"
      stroke-linejoin="round"
    />

    <!-- 2. Sweeping Orbital Ring / Swoosh (Wraps gracefully from lower-left around star to top-right) -->
    <path
      d="M 12 66 
         C 9 53, 21 35, 45 28
         C 64 22, 80 27, 84 38
         C 88 49, 79 66, 55 73
         C 34 79, 16 75, 12 66"
      stroke="url(#ringGoldGrad)"
      stroke-width="3.2"
      stroke-linecap="round"
      fill="none"
    />

    <!-- 3. Four-Point Diamond Sparkle Star at Top-Right of the Orbit Ring -->
    <path
      d="M 73 9
         Q 73 15.5 78 15.5
         Q 73 15.5 73 22
         Q 73 15.5 68 15.5
         Q 73 15.5 73 9 Z"
      fill="#FFFFFF"
    />
    <circle cx="73" cy="15.5" r="1.3" fill="#FFFDF2" />
  </g>
</svg>
